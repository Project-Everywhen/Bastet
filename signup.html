<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Bastet</title>
<link rel="icon" type="image/x-icon" href="/assets/images/bastet-logo.svg">
<link rel="stylesheet" href="styles.css?v=2.0">
<link rel="stylesheet" href="style.css?v=1.1">
<script type="text/javascript" src="validation.js" defer></script>
</head>
<body>
  <main class="card">
    <aside class="side">
      <p class="brand">Bastet<small>by Project Everywhen</small></p>
      <div>
        <p class="pitch">Your next favourite film is waiting.</p>
        <div class="perf" aria-hidden="true"></div>
      </div>
    </aside>

    <section class="form-wrap">
      <h1>New Here? Sign up</h1>
      <p class="sub">Sign up and enter the world of Movies.</p>

      <form id="signupForm" novalidate>
        <div class="field" id="nameField">
          <label for="name">Name</label>
          <input type="text" id="name" name="Firstname" autocomplete="name" aria-describedby="nameErr" required>
          <p class="error" id="nameErr" aria-live="polite"></p>
        </div>

        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailErr" required>
          <p class="error" id="emailErr" aria-live="polite"></p>
        </div>

        <div class="field" id="passField">
          <label for="password">Password</label>
          <div class="input-row">
            <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="passErr" required>
          </div>
          <p class="error" id="passErr" aria-live="polite"></p>
        </div>

        <div class="field" id="repeatpassField">
          <label for="repeatPassword">Repeat Password</label>
          <div class="input-row">
            <input type="password" id="repeatPassword" name="Repeatpassword" autocomplete="new-password" aria-describedby="repeatErr" required>
          </div>
          <p class="error" id="repeatErr" aria-live="polite"></p>
        </div>


        <button type="submit" class="btn" id="submitBtn">Sign up</button>
        <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
      </form>

      <p class="alt">Already have an account? <a href="login.html">Login to your account</a></p>
    </section>
  </main>
</body>
</html>
