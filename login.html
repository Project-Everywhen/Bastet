<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | CineMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --curtain: #8E1B32;
    --curtain-dark: #5E0F21;
    --ink: #1B1730;
    --paper: #FFFFFF;
    --mist: #ECEAF4;
    --line: #CFCBE0;
    --error: #B3261E;
    --serif: "DM Serif Display", Georgia, serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--mist);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(920px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--paper);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(27, 23, 48, .18);
  }

  /* Left: the curtain panel */
  .side {
    position: relative;
    padding: 48px 40px;
    color: #fff;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 22px, rgba(255,255,255,.04) 22px 44px),
      var(--curtain);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 460px;
  }
  .brand { font-family: var(--serif); font-size: 2rem; margin: 0; }
  .brand small { display: block; font-family: var(--sans); font-size: .85rem; opacity: .8; margin-top: 4px; }
  .pitch { font-family: var(--serif); font-size: 2.1rem; line-height: 1.15; margin: 0; max-width: 14ch; }
  .perf { /* film perforation strip */
    height: 14px; margin-top: 24px; opacity: .55;
    background: radial-gradient(circle, #fff 4px, transparent 5px) 0 0 / 22px 14px repeat-x;
  }

  /* Right: the form */
  .form-wrap { padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0 0 6px; }
  .sub { margin: 0 0 28px; color: #5A5672; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; font-size: .95rem; }
  .input-row { position: relative; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid #E8A1B0; outline-offset: 2px; border-color: var(--curtain);
  }
  .field.invalid input { border-color: var(--error); }
  .error { color: var(--error); font-size: .85rem; margin: 6px 0 0; min-height: 1.1em; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; font: inherit; font-size: .85rem; color: var(--curtain);
    cursor: pointer; padding: 6px 8px; border-radius: 6px; font-weight: 500;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 22px; font-size: .9rem; }
  .row label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; }
  a { color: var(--curtain); }
  .btn {
    width: 100%; padding: 13px; font: inherit; font-weight: 700; color: #fff;
    background: var(--curtain); border: 0; border-radius: 8px; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--curtain-dark); }
  .btn[disabled] { opacity: .65; cursor: progress; }
  .form-msg { margin: 14px 0 0; font-size: .9rem; min-height: 1.2em; }
  .form-msg.fail { color: var(--error); }
  .form-msg.ok { color: #1B6B3A; }
  .alt { margin-top: 22px; text-align: center; font-size: .95rem; }

  @media (max-width: 720px) {
    .card { grid-template-columns: 1fr; }
    .side { min-height: 0; padding: 28px; gap: 18px; }
    .pitch { font-size: 1.5rem; max-width: none; }
    .perf { display: none; }
    .form-wrap { padding: 32px 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <aside class="side">
      <p class="brand">CineMatch<small>by Bastet</small></p>
      <div>
        <p class="pitch">Your next favourite film is waiting.</p>
        <div class="perf" aria-hidden="true"></div>
      </div>
    </aside>

    <section class="form-wrap">
      <h1>Welcome back</h1>
      <p class="sub">Log in to see your matches.</p>

      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailErr" required>
          <p class="error" id="emailErr" aria-live="polite"></p>
        </div>

        <div class="field" id="passField">
          <label for="password">Password</label>
          <div class="input-row">
            <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="passErr" required>
            <button type="button" class="toggle" id="toggle" aria-pressed="false">Show</button>
          </div>
          <p class="error" id="passErr" aria-live="polite"></p>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> Keep me logged in</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn" id="submitBtn">Log in</button>
        <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
      </form>

      <p class="alt">New to CineMatch? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

<script>
  const form = document.getElementById('loginForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const toggle = document.getElementById('toggle');
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');

  // Show / hide password
  toggle.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    toggle.textContent = hidden ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', String(hidden));
  });

  function setError(fieldId, errId, text) {
    document.getElementById(fieldId).classList.toggle('invalid', !!text);
    document.getElementById(errId).textContent = text;
    return !text;
  }

  function validate() {
    const e = email.value.trim();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const okEmail = setError('emailField', 'emailErr',
      !e ? 'Enter your email address.' : (!emailOk ? 'Enter a valid email, like name@example.com.' : ''));
    const okPass = setError('passField', 'passErr',
      !password.value ? 'Enter your password.' : (password.value.length < 8 ? 'Passwords have at least 8 characters.' : ''));
    return okEmail && okPass;
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.textContent = ''; msg.className = 'form-msg';
    if (!validate()) return;

    btn.disabled = true; btn.textContent = 'Logging in…';
    try {
      // TODO: replace this block with your real backend call, e.g.
      // const res = await fetch('/api/login', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ email: email.value.trim(), password: password.value,
      //                          remember: document.getElementById('remember').checked })
      // });
      // if (!res.ok) throw new Error('Incorrect email or password.');
      // window.location.href = 'home.html';

      await new Promise(r => setTimeout(r, 700)); // fake delay for the demo
      msg.textContent = 'Logged in. (Demo only: connect the backend call above.)';
      msg.classList.add('ok');
    } catch (err) {
      msg.textContent = err.message || 'Something went wrong. Try again.';
      msg.classList.add('fail');
    } finally {
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
